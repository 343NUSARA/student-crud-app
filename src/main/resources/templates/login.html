<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif;
               background: #f0f2f5; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 8px; }
        p { color: #777; font-size: 14px; margin-bottom: 28px; }
        label { display: block; color: #555; font-size: 14px;
                margin-bottom: 6px; font-weight: 500; }
        input { display: block; width: 100%; padding: 10px 14px;
                border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
                margin-bottom: 16px; outline: none; }
        input:focus { border-color: #3498db; }
        .btn { background: #2c3e50; color: white; padding: 12px 24px;
               border: none; border-radius: 8px; font-size: 15px;
               cursor: pointer; width: 100%; }
        .btn:hover { background: #1a252f; }
        .link { display: block; text-align: center; margin-top: 16px;
                color: #3498db; text-decoration: none; font-size: 14px; }
        .success { background: #d4edda; color: #155724; padding: 10px 14px;
                   border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .error { background: #f8d7da; color: #721c24; padding: 10px 14px;
                 border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h1>🔐 Welcome Back</h1>
    <p>Login to manage students</p>

    <div class="success" th:if="${param.registered}">
        Account created! Please login.
    </div>
    <div class="success" th:if="${param.logout}">
        You have been logged out.
    </div>
    <div class="error" th:if="${param.error}">
        Invalid username or password!
    </div>

    <form th:action="@{/login}" method="post">
        <label>Username</label>
        <input type="text" name="username" placeholder="Enter username" />

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" />

        <button type="submit" class="btn">Login</button>
    </form>
    <a href="/register" class="link">Don't have an account? Register</a>
</div>
</body>
</html>
