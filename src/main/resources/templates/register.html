<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif;
               background: #f0f2f5; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 8px; }
        p { color: #777; font-size: 14px; margin-bottom: 28px; }
        label { display: block; color: #555; font-size: 14px;
                margin-bottom: 6px; font-weight: 500; }
        input { display: block; width: 100%; padding: 10px 14px;
                border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
                margin-bottom: 16px; outline: none; }
        input:focus { border-color: #3498db; }
        .btn { background: #27ae60; color: white; padding: 12px 24px;
               border: none; border-radius: 8px; font-size: 15px;
               cursor: pointer; width: 100%; }
        .btn:hover { background: #219a52; }
        .link { display: block; text-align: center; margin-top: 16px;
                color: #3498db; text-decoration: none; font-size: 14px; }
        .error { background: #f8d7da; color: #721c24; padding: 10px 14px;
                 border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
    </style>
</head>
<body>
<div class="card">
    <h1>📝 Create Account</h1>
    <p>Register to get started</p>

    <div class="error" th:if="${error}" th:text="${error}"></div>

    <form action="/register" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" />

        <label>Password</label>
        <input type="password" name="password" placeholder="Choose a password" />

        <button type="submit" class="btn">Create Account</button>
    </form>
    <a href="/login" class="link">Already have an account? Login</a>
</div>
</body>
</html>
