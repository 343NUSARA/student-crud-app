<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Form</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif;
               background: #f0f2f5; min-height: 100vh;
               display: flex; align-items: center; justify-content: center; }
        .card { background: white; padding: 40px; border-radius: 16px;
                box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 420px; }
        h1 { color: #2c3e50; font-size: 24px; margin-bottom: 28px; }
        label { display: block; color: #555; font-size: 14px;
                margin-bottom: 6px; font-weight: 500; }
        input, select { display: block; width: 100%; padding: 10px 14px;
                border: 1px solid #ddd; border-radius: 8px; font-size: 14px;
                margin-bottom: 6px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #3498db; }
        input.error { border-color: #e74c3c; }
        .error-msg { color: #e74c3c; font-size: 12px; margin-bottom: 14px; }
        .btn-save { background: #27ae60; color: white; padding: 12px 24px;
                    border: none; border-radius: 8px; font-size: 15px;
                    cursor: pointer; width: 100%; margin-top: 4px; }
        .btn-save:hover { background: #219a52; }
        .back-link { display: block; text-align: center; margin-top: 16px;
                     color: #3498db; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
<div class="card">
    <h1>🎓 Student Form</h1>
    <form th:action="@{/students/save}" th:object="${student}" method="post">
        <input type="hidden" th:field="*{id}" />

        <label>Name</label>
        <input type="text" th:field="*{name}"
               th:class="${#fields.hasErrors('name')} ? 'error' : ''"
               placeholder="Enter full name" />
        <p class="error-msg" th:if="${#fields.hasErrors('name')}"
           th:errors="*{name}"></p>

        <label>Email</label>
        <input type="email" th:field="*{email}"
               th:class="${#fields.hasErrors('email')} ? 'error' : ''"
               placeholder="Enter email address" />
        <p class="error-msg" th:if="${#fields.hasErrors('email')}"
           th:errors="*{email}"></p>

        <label>Phone</label>
        <input type="text" th:field="*{phone}"
               placeholder="Enter phone number" />

        <label>Course</label>
        <select th:field="*{course}">
            <option value="">-- Select Course --</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Business Administration">Business Administration</option>
        </select>

        <button type="submit" class="btn-save">Save Student</button>
    </form>
    <a href="/students" class="back-link">← Back to list</a>
</div>
</body>
</html>
